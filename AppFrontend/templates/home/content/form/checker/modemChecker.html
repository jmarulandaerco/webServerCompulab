{% load static %}

<div class="form-container">

    <form id="myForm" method="post">
        {% csrf_token %}

        <div class="form-group">
            <label for="connection">Nombre conexión</label>
            <input type="text" id="connection" name="connection" required>
        </div>

        <div class="form-group">
            <label for="attemts">Número de intentos conexión</label>
            <input type="text" id="attemts" name="attemts" required>
        </div>
        <button class="buttonClass" type="button"
            onclick="updateModemChecker()">Guardar</button>
    </form>
</div>
