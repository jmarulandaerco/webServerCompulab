{% load static %}

<div class="form-container">

    <form id="myForm" method="post">
        {% csrf_token %}
     

        <div class="form-group">
            <label for="ipOne">Enter the IP address for Wired connection 1 (e.g., 10.6.20.5/24):</label>
            <input type="text" id="ipOne" name="ipOne" required>
        </div>

        <div class="form-group">
            <label for="gatewayOne">Enter the gateway (leave empty if not needed . e.g.,10.6.20.1):</label>
            <input type="text" id="gatewayOne" name="gatewayOne">
        </div>
        <button class="buttonClass" type="button" onclick="interfaceEthernetOne()">Save</button>
    </form>
</div>
