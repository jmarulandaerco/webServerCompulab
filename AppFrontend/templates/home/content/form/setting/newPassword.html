{% load static %}

<div class="form-container">

    <form id="myForm" method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="actualPassword">Ingresar contraseña actual
                config_to</label>
            <input type="password" id="actualPassword" name="actualPassword"
                required>
        </div>

        <div class="form-group">
            <label for="newPassword">Ingresar nueva contraseña config_to</label>
            <input type="password" id="newPassword" name="newPassword" required>
        </div>
        <div class="form-group">
            <label for="replyNewPassword">Reingresar nueva contraseña
                config_to</label>
            <input type="password" id="replyNewPassword" name="replyNewPassword"
                required>
        </div>

        <button class="buttonClass" type="button"
            onclick="changePassword()">Guardar</button>
    </form>
</div>
