<div class="form-container">
    <form>
        {% csrf_token %}
        <div class="form-group">
            <label for="modem">Puerto modem</label>
            <!-- <input type="text" id="mode" name="mode" required> -->

                <option value="/dev/ttyUSB2">Puerto USB2</option>

            </select>

        </div>

        <button class="buttonClass" type="button" id="button2"

    </form>
</div>
