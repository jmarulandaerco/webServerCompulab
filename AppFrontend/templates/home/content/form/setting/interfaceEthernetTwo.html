{% load static %}

<div class="form-container">

    <form id="myForm" method="post">
        {% csrf_token %}
     

        <div class="form-group">
            <label for="ipTwo">Enter the IP address for Wired connection 2 (e.g., 10.6.20.6/24):</label>
            <input type="text" id="ipTwo" name="ipTwo" required>
        </div>

        <div class="form-group">
            <label for="gatewayTwo">Enter the gateway (leave empty if not needed . e.g.,10.6.20.1):</label>
            <input type="text" id="gatewayTwo" name="gatewayTwo">
        </div>
        <button class="buttonClass" type="button" onclick="interfaceEthernetTwo()">Save</button>
    </form>
</div>
