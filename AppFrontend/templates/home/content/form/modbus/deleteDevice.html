{% load static %}

<div class="form-container-device">

    <form id="deviceForm">
        {% csrf_token %}

        <div style="text-align: center;"><h3>Seleccionar dispositivo a borrar</h3></div>
        <div id="deviceList" style="display: flex; justify-content: center; flex-wrap: wrap; gap: 10px;">
            {% for device in listDevices %}
            <button type="button" class="device-button"
                onclick="deleteDevice('{{ device }}')">
                {{ device }}
            </button>
            {% endfor %}
        </div>

    </form>
</div>
