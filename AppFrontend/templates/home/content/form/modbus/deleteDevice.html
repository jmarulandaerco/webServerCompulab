{% load static %}

<div class="form-container">

    <form id="deviceForm">
        {% csrf_token %}

        <h3>Seleccionar dispositivo a borrar</h3>
        <div id="deviceList">
            {% for device in listDevices %}
            <button type="button" class="device-button"
                onclick="deleteDevice('{{ device }}')">
                {{ device }}
            </button>
            {% endfor %}
        </div>

    </form>
</div>
