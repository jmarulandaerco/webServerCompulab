{% load static %}

<div class="container-column form-wrapper-column">
    <div class="form-container-column">

        <form id="myForm" method="post">
            {% csrf_token %}

            <div class="form-columns">
                <!-- Primera columna -->
                <div class="form-column">
                    <div class="form-group">
                        <label for="nameRtu">Ingresar nombre del nuevo
                            dispositivo(e.g. Huawei_Inv)</label>
                        <input type="text" id="nameRtu" name="nameRtu"
                            value="Huawei" required readonly>
                    </div>

                    <div class="form-group">
                        <label for="portRtu">Seleccionar puerto serial</label>
                        <select id="portRtu" name="portRtu" required>
                            <option value="/dev/ttymxc0">Puerto serial
                                ttymxc0 IOT-GATE-IMX8PLUS (Viejo)</option>
                            <option value="/dev/ttymxc1">Puerto serial
                                ttymxc1 IOT-GATE-IMX8PLUS (Viejo)</option>
                            <option value="/dev/ttymxc1">Puerto serial
                                ttymxc1 IOT-GATE-IMX8PLUS (Viejo)</option>
                            <option value="/dev/ttyRS485">Puerto serial
                                ttyRS485 IOT-DIN-IMX8PLUS (Nuevo)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="baudrateRtu">Seleccionar velocidad de
                            transmisión</label>
                        <select id="baudrateRtu" name="baudrateRtu" required>
                            <option value="4800">4800 bps</option>
                            <option value="9600">9600 bps</option>
                            <option value="19200">19200 bps</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="initialRtu">Ingresar id de esclavo
                            inicial</label>
                        <input type="text" id="initialRtu" name="initialRtu"
                            value="1" required>
                    </div>

                    <div class="form-group">
                        <label for="endRtu">Ingresar esclavo final</label>
                        <input type="text" id="endRtu" name="endRtu" value="1"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="modbus_function_rtu">Ingresar función
                            modbus</label>
                        <select id="modbus_function_rtu"
                            name="modbus_function_rtu" required>
                            <option value="3">Holding register (3)</option>
                            <option value="4">Input register (4)</option>
                            <option value="6">Write register (6)</option>
                            <option value="10">Write multiple registers
                                (10)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="initial_address_rtu">Ingresar dirección
                            inicial</label>
                        <input type="text" id="initial_address_rtu"
                            name="initial_address_rtu" value="3208" required>
                    </div>

                    <div class="form-group">
                        <label for="total_registers_rtu">Ingresar total
                            registros</label>
                        <input type="text" id="total_registers_rtu"
                            name="total_registers_rtu" value="100" required>
                    </div>

                </div>

                <!-- Segunda columna -->
                <div class="form-column">

                    <div class="form-group">
                        <label for="modbus_map_folder">Seleccionar carpeta mapa
                            modbus</label>
                        <select id="modbus_map_folder" name="modbus_map_folder"
                            required onchange="handleSelectChange()">

                        </select>
                    </div>

                    <div class="form-group">
                        <label for="modbus_map_json">Seleccionar json</label>
                        <select id="modbus_map_json" name="modbus_map_json"
                            required>

                        </select>
                    </div>

                    <div class="form-group">
                        <label for="modbus_mode_rtu">Seleccionar modo
                            Modbus</label>
                        <select id="modbus_mode_rtu" name="modbus_mode_rtu"
                            required>
                            <option value="ModbusMode.READ">Lectura</option>
                            <option value="ModbusMode.WRITE">Escritura</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="device_type_rtu">Seleccionar tipo de
                            dispositivo</label>
                        <select id="device_type_rtu" name="device_type_rtu"
                            required>
                            <option value="1">Inversor</option>
                            <option value="2">Estación meteorológica</option>
                            <option value="3">Piranómetro</option>
                            <option value="4">Sensor de temperatura
                                ambiente</option>
                            <option value="5">Temperatura del módulo</option>
                            <option value="6"> Analizador de
                                potencia Telemetri</option>
                            <option value="7">Sensor de suciedad</option>
                            <option value="8">Sensor de humedad</option>
                            <option value="9">Sensor de velocidad del
                                viento</option>
                            <option value="10">Totalizador o interruptor
                                principal</option>
                            <option value="11">Medidor bidireccional</option>
                            <option value="12">Unidad de monitoreo</option>
                            <option value="13">Medidor de potencia
                                Neuplus</option>

                        </select>
                    </div>

                    <div class="form-group">
                        <label for="save_db_rtu">Guardar en base de datos
                            local</label>
                        <select id="save_db_rtu" name="save_db_rtu" required>
                            <option value="True">Si</option>
                            <option value="False">No</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="server_send_rtu">Enviar a ENRG</label>
                        <select id="server_send_rtu" name="server_send_rtu"
                            required>
                            <option value="True">Si</option>
                            <option value="False">No</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-group button-container">
                <button class="buttonClass" type="button"
                    onclick="updateDeviceRtu()">Guardar</button>
            </div>
        </form>
    </div>
</div>
