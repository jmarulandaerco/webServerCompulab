{% load static %}

<div class="container-column form-wrapper-column">
    <div class="form-container-column">

        <form id="myForm" method="post">
            {% csrf_token %}

            <div class="form-columns">
                <!-- Primera columna -->
                <div class="form-column">
                    <div class="form-group">
                        <label for="name">Ingresar nombre del nuevo
                            dispositivo(e.g. Huawei_Inv)</label>
                        <input type="text" id="name" name="name" value="Huawei"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="port">Seleccionar puerto serial</label>
                        <select id="port" name="port" required>
                            <option value="/dev/ttymxc0">Puerto serial
                                ttymxc0 IOT-GATE-iMX8 (Viejo)</option>
                            <option value="/dev/ttymxc1">Puerto serial
                                ttymxc1 IOT-GATE-iMX8 (Viejo)</option>
                            
                            <option value="/dev/ttyRS485">Puerto serial
                                ttyRS485 IOT-DIN-IMX8PLUS (Nuevo)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="baudrate">Seleccionar velocidad
                            transmisión</label>
                        <select id="baudrate" name="baudrate" required>
                            <option value="4800">4800 bps</option>
                            <option value="9600" selected>9600 bps</option>
                            <option value="19200">19200 bps</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="initial">Ingresar id esclavo inicial</label>
                        <input type="text" id="initial" name="initial" value="1"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="end">Ingresar id esclavo final</label>
                        <input type="text" id="end" name="end" value="1"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="modbus_function">Ingresar función
                            modbus</label>
                        <select id="modbus_function" name="modbus_function"
                            required>
                            <option value="3" selected>Holding register (3)</option>
                            <option value="4">Input register (4)</option>
                            <option value="6">Write register (6)</option>
                            <option value="10">Write multiple registers
                                (10)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="initial_address">Ingresar dirección
                            inicial</label>
                        <input type="text" id="initial_address"
                            name="initial_address" value="32008" required>
                    </div>

                    <div class="form-group">
                        <label for="total_registers">Ingresar total
                            registros</label>
                        <input type="text" id="total_registers"
                            name="total_registers" value="100" required>
                    </div>

                </div>

                <!-- Segunda columna -->
                <div class="form-column">

                    <div class="form-group">
                        <label for="modbus_map_folder">Seleccionar carpeta mapa
                            modbus</label>
                        <select id="modbus_map_folder" name="modbus_map_folder"
                            required onchange="handleSelectChange()">

                        </select>
                    </div>

                    <div class="form-group">
                        <label for="modbus_map_json">Seleccionar json</label>
                        <select id="modbus_map_json" name="modbus_map_json"
                            required>

                        </select>
                    </div>

                    <div class="form-group">
                        <label for="modbus_mode">Seleccionar modo Modbus</label>
                        <select id="modbus_mode" name="modbus_mode" required>
                            <option value="ModbusMode.READ" selected>Lectura</option>
                            <option value="ModbusMode.WRITE">Escritura</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="device_type">Seleccionar tipo
                            dispositivo</label>
                        <select id="device_type" name="device_type" required>
                            <option value="1">Inversor</option>
                            <option value="2">Estación meteorológica</option>
                            <option value="3">Piranómetro</option>
                            <option value="4">Sensor de temperatura
                                ambiente</option>
                            <option value="5">Temperatura del módulo</option>
                            <option value="6">Analizador de
                                potencia Telemetri</option>
                            <option value="7">Sensor de suciedad</option>
                            <option value="8">Sensor de humedad</option>
                            <option value="9">Sensor de velocidad del
                                viento</option>
                            <option value="10">Totalizador o interruptor
                                principal</option>
                            <option value="11">Medidor bidireccional</option>
                            <option value="12">Unidad de monitoreo</option>
                            <option value="13">Analizador de potencia
                                Neuplus</option>
                            <option value="14">Smart Logger</option>
                            <option value="15">Batería </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="save_db">Guardar en base de datos
                            local</label>
                        <select id="save_db" name="save_db" required>
                            <option value="True" selected>Si</option>
                            <option value="False">No</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="server_send">Enviar a ENRG</label>
                        <select id="server_send" name="server_send" required>
                            <option value="True">Si</option>
                            <option value="False" selected>No</option>
                        </select>
                    </div>
                </div>

            </div>

            <div class="form-group button-container">
                <button class="buttonClass" type="button"
                    onclick="addDeviceRtu()">Guardar</button>
            </div>
        </form>
    </div>
</div>
