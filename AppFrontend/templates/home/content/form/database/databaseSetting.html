{% load static %}

<div class="container" style="overflow-y: visible !important;">
</div>

<div class="container" id="content2">
    <div class="form-container">
        <link rel="stylesheet" href="{% static 'css/form_large.css' %}">

        <form id="myForm" method="post">
            {% csrf_token %}

            <div class="form-group">
                <label for="host">Host base de datos</label>
                <input type="text" id="host" name="host" required>
            </div>

            <div class="form-group">
                <label for="port">Puerto base de datos</label>
                <input type="text" id="port" name="port" required>
            </div>

            <div class="form-group">
                <label for="name">Nombre base de datos</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="form-group">
                <label for="timeout">Tiempo de espera</label>
                <input type="text" id="timeout" name="timeout" required>
            </div>

            <div class="form-group">
                <label for="date">Formato fecha</label>
                <input type="text" id="date" name="date" required>
            </div>

            
            <div class="form-group">
                <label>Enviar promedio medición</label>
                <div class="radio-group">
                    <input type="radio" id="average_measure_yes"
                        name="average_measure" value="Yes" required>
                    <label for="average_measure_yes">Si</label>
                    <input type="radio" id="average_measure_no"
                        name="average_measure" value="No" required>
                    <label for="average_measure_no">No</label>
                </div>
            </div>

            <div class="form-group">
                <button class="buttonClass" type="button"
                    onclick="updateInformationDatabase()">Guardar</button>
            </div>
            <div class="form-group">
                <button class="buttonClass" type="button"
                    onclick="deleteDatabase()">Borrar datos base de
                    datos</button>
            </div>

        </form>
    </div>
</div>
